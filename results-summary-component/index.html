<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Results Summary Component é uma página de demonstração que apresenta um resumo visual de resultados, com layout moderno, responsivo e foco em boas práticas de HTML e CSS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="./src/css/style.css" as="style">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="icon" type="image/png" href="./favicon-32x32.png">
  <title>Results Summary Component</title>
</head>

<body>
  <main class="container">
    <section class="result">
      <h1 class="result__title">Your Result</h1>
      <div class="result__score">
        <span class="result__score-achieved">76</span>
        <span class="result__score-max">of 100</span>
      </div>
      <div class="result__feedback">
        <span class="result__feedback-rating">Great</span>
        <p class="result__feedback-text">You scored higher than 65% of the people who have taken these tests.</p>
      </div>
    </section>

    <section class="summary">
      <h2 class="summary__title">Summary</h2>
      <ul class="summary__list">
        <li class="summary__item summary__item--reaction">
          <span class="summary__category summary__category--reaction"><img class="summary__icon" src="./src/img/icon-reaction.svg" alt="">Reaction</span>
          <span class="summary__score">
            <span class="summary__score-achieved">80</span>
            <span class="summary__score-max">/ 100</span>
          </span>
        </li>

        <li class="summary__item summary__item--memory">
          <span class="summary__category summary__category--memory"><img class="summary__icon" src="./src/img/icon-memory.svg" alt="">Memory</span>
          <span class="summary__score">
            <span class="summary__score-achieved">92</span>
            <span class="summary__score-max">/ 100</span>
          </span>
        </li>

        <li class="summary__item summary__item--verbal">
          <span class="summary__category summary__category--verbal"><img class="summary__icon" src="./src/img/icon-verbal.svg" alt="">Verbal</span>
          <span class="summary__score">
            <span class="summary__score-achieved">61</span>
            <span class="summary__score-max">/ 100</span>
          </span>
        </li>

        <li class="summary__item summary__item--visual">
          <span class="summary__category summary__category--visual"><img class="summary__icon" src="./src/img/icon-visual.svg" alt="">Visual</span>
          <span class="summary__score">
            <span class="summary__score-achieved">73</span>
            <span class="summary__score-max">/ 100</span>
          </span>
        </li>
      </ul>
      <button class="summary__button" type="button">Continue</button>
    </section>
  </main>
</body>

</html>
