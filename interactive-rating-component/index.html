<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk&family=Overpass:ital,wght@400;700&display=swap" rel="stylesheet">

  <link rel="preload" href="./src/css/style.css" as="style">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="shortcut icon" href="./favicon-32x32.png" type="image/x-icon">
  <title>Interactive Rating Component</title>
</head>

<body>
  <main class="container">
    <div class="rating">
      <div class="rating__img">
        <img src="./src/img/icon-star.svg" alt="">
      </div>

      <div class="rating__content">
        <h1 class="rating__title">How did we do?</h1>
        <p class="rating__text">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!
        </p>
      </div>

      <div class="rating__options">
        <button class="rating__btn" data-value="1">1</button>
        <button class="rating__btn" data-value="2">2</button>
        <button class="rating__btn" data-value="3">3</button>
        <button class="rating__btn" data-value="4">4</button>
        <button class="rating__btn" data-value="5">5</button>
      </div>
      <button class="rating__submit" type="submit">Submit</button>
    </div>

    <div class="thank-you hidden">
      <div class="thank-you__img">
        <img src="./src/img/illustration-thank-you.svg" alt="Illustration of thank you">
      </div>

      <div class="thank-you__selection">
        <span class="thank-you__text">You selected <span class="thank-you__rating"></span> out of 5
        </span>
      </div>

      <div class="thank-you__message">
        <h1 class="thank-you__title">Thank you!</h1>
        <p class="thank-you__description">We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
      </div>
    </div>

  </main>
  <script src="./src/js/script.js"></script>
</body>

</html>
